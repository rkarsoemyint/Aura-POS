{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-base-100 p-6 rounded-xl shadow border">
    <h2 class="text-2xl font-bold mb-6">Edit Staff</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="form-control mb-4">
            <label class="label"><span class="label-text">Username</span></label>
            <input type="text" name="username" value="{{ staff.username }}" class="input input-bordered" required>
        </div>
        
        <div class="form-control mb-6">
            <label class="label cursor-pointer justify-start gap-4">
                <input type="checkbox" name="is_active" class="checkbox checkbox-primary" {% if staff.is_active %}checked{% endif %}>
                <span class="label-text text-lg">Active Account</span>
            </label>
        </div>

        <div class="flex gap-2">
            <button type="submit" class="btn btn-primary flex-1">Update Staff</button>
            <a href="{% url 'staff_list' %}" class="btn btn-ghost">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
